<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Chiikawa Store</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <h1>Chiikawa shopping</h1>
    <nav>
      <a href="codigo.html" >Inicio</a>
      <a href="peluches.html" >Peluches</a>
      <a href="contacto.html" class="activo">Contacto</a>
      <a href="carrito.html" >Carrito de compras (<span id="cantidad">0</span>)</a>
    </nav>
  </header>

  <section>
    <h2>Contáctanos</h2>
    <form id="formulario">
      <input type="text" id="nombre" placeholder="Nombre">
      <input type="email" id="correo" placeholder="Correo">
      <select id="motivo">
        <option value="">Cual es tu consulta?</option>
        <option>Consulta de un peluche</option>
        <option>Estado de mi pedido</option>
        <option>Otro</option>
      </select>
      <textarea id="mensaje" rows="4" placeholder="Tu mensaje"></textarea>
      <button type="submit" class="boton">Enviar</button>
      <p id="aviso"></p>
    </form>
  </section>

  <footer>
    <p>Encuentranos en tik tok e instagram como @yourchiikawastore</p>
  </footer>
  <script src="javaaa.js"></script>
</body>
</html>
